      <stop offset="0" stop-color="#F7C557"/>
      <stop offset="1" stop-color="#EDA92E"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3"/>
  <!-- garis kedua huruf X -->
