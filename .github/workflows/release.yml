name: release

# A release is published automatically when the version in manifest.json changes on main
# (or when a tag like v3.1.0 is pushed). GitHub builds the ZIP from that exact commit, with a
# SHA-256 checksum and a signed build-provenance attestation, so users can check that the file
# they downloaded is exactly what this repository built.
on:
  push:
    branches: [main]
    paths: ["manifest.json", ".github/workflows/release.yml"]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests
        if: steps.v.outputs.skip != 'true'
        run: node --test
      - name: Build ZIP
        if: steps.v.outputs.skip != 'true'
        run: bash scripts/package.sh dist
      - name: Attest build provenance
        if: steps.v.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publish GitHub release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          NOTES="$(awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          gh release create "v$VERSION" dist/sapux-*.zip dist/sapux-*.zip.sha256 \
            --target "$GITHUB_SHA" --title "SapuX $VERSION" --notes "$NOTES" --latest
