name: release

# Push a tag like v3.1.0 to publish a release. The ZIP is built by GitHub from the tagged source,
# with a SHA-256 checksum and a signed build-provenance attestation, so users can check that the
# file they downloaded is exactly what this repository built.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Tag matches manifest version
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Build ZIP
        run: bash scripts/package.sh dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/sapux-*.zip dist/sapux-*.zip.sha256 \
            --title "SapuX $VERSION" --notes "$NOTES"
